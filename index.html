<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Winamp's MilkDrop, in your browser. Play the original .milk presets, live-edit the equations while music plays, react to any audio — a tab, your mic, a YouTube link — and share the exact view as a link."
    />

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://toil.fyi/" />
    <style>
      *,:after,:before{box-sizing:border-box}
      body,html{margin:0;padding:0;min-height:100%}
      body{background:#05070c;color:#e9fbff;font-family:system-ui,sans-serif}
      .stims-loading{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:start;padding:calc(clamp(64px,8vh,96px) + 14px) calc(clamp(20px,6vw,72px) + 24px) 42px;background:radial-gradient(circle at 30% 20%,rgba(95,192,181,.08),transparent 50%),radial-gradient(circle at 70% 80%,rgba(211,137,84,.06),transparent 50%),#05070c;color:#e9fbff;font-family:var(--font-family-base,system-ui,sans-serif);opacity:1;visibility:visible;transition:opacity 220ms ease-out,visibility 0s linear 220ms}
      .stims-loading[hidden]{display:none}
      .stims-loading--leaving{animation:none;opacity:0;visibility:hidden;pointer-events:none}
      .stims-loading__content{display:grid;justify-items:start;gap:18px;width:min(52rem,100%);animation:loading-breathe 4s ease-in-out infinite}
      .stims-loading__brand{margin:0;font-family:var(--stims-display,var(--font-family-base,system-ui,sans-serif));font-size:clamp(3rem,7vw,5.5rem);font-weight:600;line-height:.92;letter-spacing:-.03em;color:var(--stims-ink-strong,#fff8ef)}
      .stims-loading__status{display:flex;align-items:center;gap:12px;min-height:34px}
      .stims-loading__spinner{width:28px;height:28px;flex:0 0 auto;position:relative;border-radius:50%;background:conic-gradient(from 0deg,rgba(95,192,181,.95),rgba(233,212,155,.85),rgba(211,137,84,.95),rgba(119,201,255,.85),rgba(95,192,181,.95));animation:stims-spin 1.2s cubic-bezier(.4,0,.2,1)infinite}
      .stims-loading__spinner:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 180deg,transparent,rgba(119,201,255,.12),transparent,rgba(95,192,181,.08));animation:stims-spin 2s cubic-bezier(.4,0,.2,1)infinite reverse;opacity:.6}
      .stims-loading__spinner:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#05070c}
      .stims-loading__text{font-size:.95rem;letter-spacing:.03em;opacity:.7;background:linear-gradient(135deg,#e9fbff,rgba(119,201,255,.85));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:stims-pulse 2s ease-in-out infinite}
      .stims-loading__dots{display:inline-flex;gap:3px;margin-left:2px}
      .stims-loading__dots span{width:4px;height:4px;display:inline-block;border-radius:50%;background:rgba(119,201,255,.8);opacity:.6;animation:stims-bounce 1.4s ease-in-out infinite both}
      .stims-loading__dots span:first-child{animation-delay:-.32s}
      .stims-loading__dots span:nth-child(2){animation-delay:-.16s}
      .stims-crawl-links{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
      @keyframes stims-spin{to{transform:rotate(360deg)}}
      @keyframes stims-pulse{0%,to{opacity:.5}50%{opacity:.85}}
      @keyframes stims-bounce{0%,80%,to{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:.9}}
      @keyframes loading-breathe{0%,to{opacity:.85}50%{opacity:1}}
      @media(max-width:767px){.stims-loading{padding:90px 28px 34px}}
      @media(prefers-reduced-motion:reduce){.stims-loading{transition:none}.stims-loading__content,.stims-loading__spinner,.stims-loading__spinner:before,.stims-loading__text,.stims-loading__dots span{animation:none}}
      .stims-loading__fallback{background:#0d121c;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:32px 40px;max-width:420px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.5);margin:20px}
      .stims-loading__fallback p{margin:0 0 24px;font-size:1rem;line-height:1.6;opacity:0.85}
      .stims-loading__retry{display:inline-block;background:#5fc0b5;color:#0a0f19;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:500;font-size:0.9rem;letter-spacing:0.02em;transition:transform 150ms ease,opacity 150ms ease}
      .stims-loading__retry:hover{transform:scale(1.03);opacity:0.95}
      .stims-loading__retry:active{transform:scale(0.98)}
    </style>
    <!-- The entry module loads via the module script tag at the end of body.
         A modulepreload for /src/js/app.ts is redundant there, and Rolldown
         emits it as a data:video/mp2t link that fails every page load. -->
    <link rel="preload" href="/milkdrop-presets/starter-catalog.json" as="fetch" crossorigin="anonymous" />
    <!-- Fonts are same-origin now (src/css/fonts.css), so there is nothing to
         preconnect to. The Sans face is preloaded because the wordmark that
         paints first is set in it. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#0891b2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('stims:theme');
          if (stored === 'light') document.documentElement.classList.add('light');
          else if (stored === 'dark') document.documentElement.classList.add('dark');
          else if (window.matchMedia('(prefers-color-scheme: light)').matches)
            document.documentElement.classList.add('light');
        } catch (_e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Stims — MilkDrop-Inspired Audio Visualizer",
        "description": "Winamp's MilkDrop, in your browser. Play the original .milk presets, live-edit the equations while music plays, react to any audio — a tab, your mic, a YouTube link — and share the exact view as a link.",

  <body data-page="experience">
    <div
      class="stims-loading"
      id="stims-loading"
      role="status"
      aria-live="polite"
      aria-label="Loading Stims"
    >
      <div class="stims-loading__content">
        <div class="stims-loading__brand" aria-hidden="true">Stims</div>
        <div class="stims-loading__status">
          <div class="stims-loading__spinner" aria-hidden="true"></div>
          <div class="stims-loading__text" id="stims-loading-text">
            Warming up the visuals
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>


    <!-- inert: these exist for crawlers reading the HTML source; without it
         they are 8 invisible tab stops in front of the app, and Enter on one
         navigates the page away. -->
    <nav class="stims-crawl-links" aria-label="Crawlable site links" inert>
      <a href="/">Visualizer</a>
      <a href="/performance/">Compatibility and performance</a>
      <a href="/discover/audio-reactive">Audio-reactive visualizers</a>
      <a href="/discover/hall-of-fame">Hall of fame presets</a>

      <a href="/discover/tunnel">Tunnel visualizers</a>

      <a href="/discover/ambient">Ambient visualizers</a>

    <noscript>
      <div class="stims-loading" role="alert">
        <div class="stims-loading__fallback">
          <p>JavaScript is required to run Stims.</p>
          <p>Please enable JavaScript in your browser and reload the page.</p>
        </div>
      </div>
    </noscript>
    <script>
      (() => {
        const TIMEOUT_MS = 15000;
        // Deliberately not a per-phase readout. The boot phases are real, but
        // "Starting app shell" / "Starting visualizer runtime" describe our
        // architecture, not anything the visitor asked about or can act on,
        // and they flicker past in well under a second on a warm load. One
        // calm line holds, and only a genuinely slow load says more — with a
        // reason the visitor can understand.
        const SLOW_MS = 6000;
        const text = () => document.querySelector('.stims-loading__text');
        window.addEventListener('stims:load-status', (event) => {
          if (event?.detail?.phase === 'shell-rendered') {
            clearTimeout(timer);
            clearTimeout(slowTimer);
          }
        });
        const slowTimer = setTimeout(() => {
          const target = text();
          if (target && !document.getElementById('stims-main')) {
            target.textContent = 'Still loading — first visit sets up the preset library';
          }
        }, SLOW_MS);
        const timer = setTimeout(() => {
          const loading = document.getElementById('stims-loading');
          if (!loading || document.getElementById('stims-main')) return;
          clearTimeout(slowTimer);
          loading.innerHTML =
            '<div class="stims-loading__fallback">' +
            '<p>Stims is taking longer than expected to load.</p>' +
            '<p><a href="." class="stims-loading__retry">Reload page</a></p>' +
            '</div>';
        }, TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="/src/js/app.ts"></script>
  </body>

version: 2
updates:
  # "bun", not "npm": the npm updater edits package.json only, and this repo
  # has no package-lock.json, so every version bump it opened left bun.lock
  # behind and failed CI's frozen-lockfile install (#1179, #1178).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "github"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    open-pull-requests-limit: 10
    labels:
      - "github"

version: 2
updates:
  # "bun", not "npm": the npm updater edits package.json only, and this repo
  # has no package-lock.json, so every version bump it opened left bun.lock
  # behind and failed CI's frozen-lockfile install (#1179, #1178).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "github"
    # Playwright's packages share one browser build and one set of types, so
    # they must move together. Bumped separately, #1262 merged playwright 1.63
    # beside @playwright/test 1.62: two playwright-core copies, a typecheck
    # failure, and e2e launching a browser build nothing had installed.
    groups:
      playwright:
        patterns:
          - "playwright"
          - "playwright-core"
          - "@playwright/*"
      # react and react-dom must be the same version (React refuses to run
      # mismatched); #1280 bumped react alone and failed CI.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The @codemirror packages share one @codemirror/state instance (two
      # copies break its instanceof checks), and package.json pins them in
      # "overrides" as well as dependencies.
      codemirror:
        patterns:
          - "@codemirror/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    open-pull-requests-limit: 10
    labels:
      - "github"

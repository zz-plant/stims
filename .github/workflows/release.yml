name: Release

# Publishes a GitHub Release when a version tag is pushed. The release flow in
# docs/DEPLOYMENT.md tags the version after merging, but a bare tag is not a
# Release, which is why v1.1.0–v1.3.0 were written up and never showed on the
# repo page. The notes are that version's section of docs/RELEASE_NOTES.md,
# reviewed in the PR that cut the release; `release:notes` refuses a tag that
# disagrees with package.json or has no notes, so a mistyped tag publishes
# nothing.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Creating a release is a write; only this job is granted it.
    permissions:
      contents: write
    steps:
      # The local setup action is read from the checkout, so check out first.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Write release notes
        run: bun run release:notes -- "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Stims $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"

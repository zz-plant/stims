name: Package sites

# Deploys every standalone package's site to this repository's GitHub Pages
# (https://zz-plant.github.io/stims/<name>/), one site per package plus an
# index page, built by `bun run site:packages`. This is the only deployment:
# the mirror repositories (see mirror-packages.yml) are read-only and run no
# workflows.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/build-packages-site.ts'
      - '.github/workflows/pages-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: package-sites
  cancel-in-progress: true

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Build every package site
        run: bun run site:packages

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: PR automation

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  label:
    name: Apply path labels
    if: contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    # Applying a label is a write. The workflow-level `pull-requests: read`
    # above keeps validate-pr-body read-only; only this job is granted write.
    # Safe under pull_request_target because labeler never checks out or
    # executes PR-authored code.
    permissions:
      pull-requests: write
    steps:
      - name: Label pull request by changed files
        uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  validate-pr-body:
    name: Validate PR description
    if: contains(fromJson('["opened","edited","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR metadata sections
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // What this gate is for: a PR that says nothing about what it does
            // or whether it was verified. It is NOT for enforcing a heading
            // vocabulary — it failed a description that carried a mechanism,
            // a measured before/after table and a named regression test,
            // purely because the headings read "Mechanism" and "Evidence"
            // instead of "Summary" and "Testing". Rejecting a better
            // description than the template asks for teaches authors to
            // paste the template and say nothing under it.
            //
            // So: accept the substance in whatever shape it arrives, and fail
            // only on an empty or placeholder description.
            const stripped = body
              .replace(/```[\s\S]*?```/g, " ")
              .replace(/<!--[\s\S]*?-->/g, " ")
              .replace(/^\s*[-*]\s*$/gm, " ")
              .trim();

            const PLACEHOLDER = /^(n\/?a|none|-|tbd|wip|\.)$/i;
            const isEmpty = !stripped || PLACEHOLDER.test(stripped);

            // Any sign the author said how they know it works: a heading that
            // names verification, a test or gate command, or a measurement.
            const evidence = [
              /^#{1,6}\s*(testing|tests?|verification|verified|evidence|how i tested|validation|proof|measured)\b/im,
              /\b(bun run|npm run|pnpm|yarn|pytest|cargo|make)\s+[\w:.-]+/i,
              // A period only ends the window when it ends a sentence: a
              // list of `*.test.ts` files followed by "pass" is evidence.
              /\b(test|tests|suite|gate|check|ci)\b(?:[^.\n]|\.(?=\S)){0,120}\b(pass|passes|passed|green|fail|red)\b/i,
              /\b\d+(\.\d+)?\s*(%|ms|fps|px|kb|mb)\b/i,
              /\bbefore\b[^.\n]{0,60}\bafter\b/i,
            ].some((pattern) => pattern.test(body));

            const errors = [];
            if (isEmpty) {
              errors.push("The description is empty or a placeholder. Say what changed and why.");
            } else if (!evidence) {
              errors.push(
                "Nothing in the description says how you know this works. Name the tests or checks you ran, " +
                "or give a measurement — a heading, a command, or a before/after number all count."
              );
            }

            if (errors.length) {
              core.setFailed(
                ["PR description needs more than this.", ...errors].join("\n")
              );
            }

  # A squash-merge makes the PR title the subject of the commit main keeps,
  # with " (#<number>)" appended, and nothing checked it: 19 of the 50 commits
  # before this job ran past 72 characters, and one carried two types
  # ("test(frontend), docs(authoring): ..."). The Commit messages job in ci.yml
  # checks the branch's commits, which squash-merging throws away.
  #
  # Here, unlike there, length fails: retitling a PR is a free edit that
  # re-runs this job, while rewording a pushed commit rewrites history. It also
  # runs on synchronize: a job skipped on a push reports success for the new
  # head, which would let a push wave a failing title through.
  # Mirrors `prTitleError` in packages/agent-ergonomics/src/commit-msg.ts and
  # the commitMsg types in its config; change them together. Bot titles
  # (Dependabot) are generated and nobody edits them, so they are skipped.
  validate-pr-title:
    name: Validate PR title
    if: >-
      contains(fromJson('["opened","edited","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title as the squash commit's subject
        uses: actions/github-script@v9
        with:
          script: |
            const { title, number } = context.payload.pull_request;
            const types = ["feat", "fix", "refactor", "chore", "docs", "test",
              "style", "perf", "ci", "build", "revert", "hotfix"];
            const limit = 72;
            const subject = `${title} (#${number})`;
            const conventional = new RegExp(`^(${types.join("|")})(\\([^)]+\\))?!?: .+`);
            const vague = /^(fixes|fixed|stims|various fixes|certainly this works|hopefully works|hopefully|it works|works now|wip)$/i;
            const gitRevert = /^Revert ".+"$/;

            const errors = [];
            if (vague.test(title) || /\b(certainly|hopefully)\b/i.test(title)) {
              errors.push(`"${title}" does not say what changed. Describe the change and why.`);
            } else if (!gitRevert.test(title) && !conventional.test(title)) {
              errors.push(
                `"${title}" is not a Conventional Commits subject. Use type(scope): summary, ` +
                `e.g. fix(audio): close context on unmount.` +
                (/^\w+(\([^)]+\))?!?,\s*\w+/.test(title)
                  ? " One type per title: name the main change, or split the PR."
                  : "")
              );
            }
            if (subject.length > limit) {
              errors.push(
                `Squashed, this becomes "${subject}" (${subject.length} chars). ` +
                `Shorten the title to ${limit - (subject.length - title.length)} chars or fewer.`
              );
            }
            if (errors.length) {
              core.setFailed(
                ["The PR title becomes main's commit subject. Edit the title; no push is needed.", ...errors].join("\n")
              );
            }

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Commit-message hygiene is enforced locally by the husky commit-msg hook
  # (scripts/check-commit-msg.ts), and the former shader-parity job only
  # re-ran tests/unit/ files that already run inside `bun run check` below —
  # both CI jobs were duplicate enforcement and were removed to cut runner
  # usage.
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-stims

      # Fails on high/critical advisories against the lockfile. Moderate and
      # below only report locally via `bun audit`; gate them here once the
      # transitive hono advisories (via @modelcontextprotocol/sdk) clear.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Run quality gate
        run: bun run check

  parity:
    name: Parity corpus
    runs-on: ubuntu-latest
    # `bun run check` runs the `fast` profile (unit + compat), so everything in
    # tests/corpus/ — the MilkDrop/projectM parity certification corpus, the
    # compiler/IR/codegen goldens and the pixel-diff suite — ran nowhere in CI.
    # The dual-backend boundary those tests cover is the repo's densest source
    # of regressions, so it was the least-guarded thing in the build.
    # This job runs the corpus-only profile: the compat category it used to
    # duplicate already runs in the quality gate above.
    #
    # This is deliberately not the e2e visual-regression test, which stays
    # local-only: that one renders through SwiftShader on a 2-core runner, and
    # its timing assertions produced a long run of budget-widening commits
    # without ever catching a rendering bug. The corpus is CPU-only and
    # deterministic — same input, same shader text, same pixels — so it fails
    # for real reasons. It takes about 10s.
    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-stims

      # The loop-preset visual sweep in tests/corpus/ launches headless
      # Chromium, so the corpus is no longer browser-free.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run parity corpus
        run: bun run test:corpus

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Pure gate: deploys moved to Cloudflare Workers Builds (see
    # docs/DEPLOYMENT.md), which builds and deploys on push independently of
    # Actions. This job only proves the production bundle still builds.
    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-stims

      - name: Build production bundle
        run: bun run build

  integration:
    name: Browser end-to-end tests (${{ matrix.file }})
    runs-on: ubuntu-latest
    # Each e2e file gets its own runner. They used to share one job's 2 vCPUs
    # sequentially — a fresh `bun test` process per file (see run-tests.ts)
    # stopped in-process leaks from accumulating, but everything still
    # competed for the same runner's CPU/GPU budget, so whichever test
    # happened to run during a contention spike would flake with a timeout
    # that never reproduced locally. A fresh runner per file removes that
    # shared budget entirely.
    strategy:
      fail-fast: false
      matrix:
        file:
          - agent-integration.test.ts
          - chrome-visual-contract.test.ts
          - e2e-engine-mount.test.ts
    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-stims

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # engine-mount launches a headed browser for real canvas rendering, so
      # it needs a virtual display; xvfb ships with Playwright's --with-deps
      # and Chromium falls back to SwiftShader for WebGL under it.
      - name: Run browser end-to-end tests
        run: xvfb-run -a bun test --preload=./tests/setup.ts --max-concurrency=1 tests/e2e/${{ matrix.file }}

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [check, parity, build, integration]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          check_outcome="${{ needs.check.result }}"
          parity_outcome="${{ needs.parity.result }}"
          build_outcome="${{ needs.build.result }}"
          integration_outcome="${{ needs.integration.result }}"

          echo "Quality Gate: $check_outcome"
          echo "Parity Corpus: $parity_outcome"
          echo "Production Build: $build_outcome"
          echo "Integration Tests: $integration_outcome"

          if [ "$check_outcome" = "success" ] && \
             [ "$parity_outcome" = "success" ] && \
             [ "$build_outcome" = "success" ] && \
             [ "$integration_outcome" = "success" ]; then
            echo "All CI jobs passed successfully."
            exit 0
          else
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi

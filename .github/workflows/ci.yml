name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-hygiene:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git log --no-merges --format='%s' "$base..HEAD" | while IFS= read -r subject; do
            echo "$subject" > /tmp/msg.txt
            bun run check:commit-msg /tmp/msg.txt || exit 1
          done

  shader-parity:
    name: Shader & compiler regression
    runs-on: ubuntu-latest
    # Surface MilkDrop compiler/shader regressions as a dedicated check.
    # The catalog compiler smoke runs in the quality gate unit suite too,
    # but this job is path-triggered so it reports independently on PRs
    # touching the rendering pipeline.
    if: >-
      github.event_name == 'pull_request' &&
      !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for pipeline changes
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base..HEAD" -- src/js/milkdrop/ src/shaders/ public/milkdrop-presets/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run catalog compiler smoke + shader analysis
        if: steps.changed.outputs.run == 'true'
        run: bun run test tests/unit/catalog-compiler-smoke.test.ts tests/unit/milkdrop-compiler-shader-analysis.test.ts tests/unit/milkdrop-compiler-compatibility.test.ts tests/unit/milkdrop-shader-sampler-aliases.test.ts tests/unit/milkdrop-shader-execution-classification.test.ts tests/unit/primitive-rasterization-fidelity.test.ts

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run check

  parity:
    name: Parity corpus
    runs-on: ubuntu-latest
    # `bun run check` runs the `fast` profile (unit + compat), so everything in
    # tests/corpus/ — the MilkDrop/projectM parity certification corpus, the
    # compiler/IR/codegen goldens and the pixel-diff suite — ran nowhere in CI.
    # The dual-backend boundary those tests cover is the repo's densest source
    # of regressions, so it was the least-guarded thing in the build.
    #
    # This is deliberately not the e2e visual-regression test, which stays
    # local-only: that one renders through SwiftShader on a 2-core runner, and
    # its timing assertions produced a long run of budget-widening commits
    # without ever catching a rendering bug. The corpus is CPU-only and
    # deterministic — same input, same shader text, same pixels — so it fails
    # for real reasons. It takes about 10s.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The loop-preset visual sweep in tests/corpus/ launches headless
      # Chromium, so the corpus is no longer browser-free. On an exact cache
      # hit only the apt-installed system libraries are missing (the runner
      # image doesn't guarantee them and they can't be cached), so skip the
      # ~150 MB browser download and install just the deps.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run compat + parity corpus
        run: bun run test:compat

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Runs alongside `check` rather than after it: a build failure and a test
    # failure are independent signals, and gating deploy on both jobs (see
    # deploy_preview/deploy_production `needs:`) gets the same safety without
    # paying for them serially in one job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Browser end-to-end tests (${{ matrix.file }})
    runs-on: ubuntu-latest
    # Each e2e file gets its own runner. They used to share one job's 2 vCPUs
    # sequentially — a fresh `bun test` process per file (see run-tests.ts)
    # stopped in-process leaks from accumulating, but everything still
    # competed for the same runner's CPU/GPU budget, so whichever test
    # happened to run during a contention spike would flake with a timeout
    # that never reproduced locally. A fresh runner per file removes that
    # shared budget entirely.
    strategy:
      fail-fast: false
      matrix:
        file:
          - agent-integration.test.ts
          - chrome-visual-contract.test.ts
          - e2e-engine-mount.test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # On an exact cache hit only the apt-installed system libraries are
      # missing (the runner image doesn't guarantee them and they can't be
      # cached), so skip the ~150 MB browser download and install just the
      # deps.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # engine-mount launches a headed browser for real canvas rendering, so
      # it needs a virtual display; xvfb ships with Playwright's --with-deps
      # and Chromium falls back to SwiftShader for WebGL under it.
      - name: Run browser end-to-end tests
        run: xvfb-run -a bun test --preload=./tests/setup.ts --max-concurrency=1 tests/e2e/${{ matrix.file }}

  deploy_preview:
    name: Deploy Pages preview
    runs-on: ubuntu-latest
    # Previews only need the built artifact — they exist for humans to look
    # at, and the test jobs still report (and gate merging) independently.
    # Gating on `build` alone shaves the whole Playwright/e2e tail off
    # time-to-preview-URL. Production deploys below keep the full gate.
    needs:
      - build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_DEPLOYS_DISABLED != 'true'
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The install only exists to provide wrangler — the build step reuses
      # the downloaded artifact, and the committed functions/api/resvg.wasm
      # already matches what postinstall would sync — so skip scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CF_PAGES_BRANCH: ${{ github.head_ref }}
        run: bun run pages:deploy:preview:reuse

      - name: Skip preview deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare Pages preview deploy skipped because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."

  deploy_production:
    name: Deploy Pages production
    runs-on: ubuntu-latest
    needs:
      - check
      - parity
      - build
      - integration
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_PAGES_DEPLOYS_DISABLED != 'true'
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The install only exists to provide wrangler — the build step reuses
      # the downloaded artifact, and the committed functions/api/resvg.wasm
      # already matches what postinstall would sync — so skip scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Deploy production to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: bun run pages:deploy:production:reuse

      - name: Skip production deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare Pages production deploy skipped because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."

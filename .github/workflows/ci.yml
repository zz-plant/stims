name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Commit-message hygiene was left to the local commit-msg hook alone, on the
  # assumption that every commit passes through it. It does not: 20+ commits
  # whose subjects this guard rejects are on main, including a run of GitHub
  # web-editor "Update <file>.ts" commits, which never touch a local hook. This
  # job is the backstop that assumption needed.
  #
  # PR-only and deliberately narrower than the hook: it gates the Conventional
  # prefix and non-descriptive subjects — the rules that actually leaked — but
  # waives the 72-char ceiling, which current practice breaks routinely on
  # otherwise-good subjects. The hook still enforces length locally.
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The base..head range needs real history, not a depth-1 clone.
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Check commit subjects in this PR
        run: |
          bun run check:commit-msg -- \
            --range "origin/${{ github.base_ref }}..HEAD" \
            --allow-long-subjects

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      # The runner must read the local composite action's action.yml from
      # disk before it can run it, so the repository has to be checked out
      # in the workflow itself — a local action can never perform the first
      # checkout (newer runner versions fail the job at action-resolution
      # time otherwise).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'
          # The only job that runs `typecheck` and `check:architecture`, so the
          # only one that should publish their incremental caches.
          cache-compute: 'true'

      # Fails on high/critical advisories against the lockfile. Moderate and
      # below only report locally via `bun audit`; gate them here once the
      # transitive hono advisories (via @modelcontextprotocol/sdk) clear.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Run quality gate
        run: bun run check

  parity:
    name: Parity corpus
    runs-on: ubuntu-latest
    # tests/corpus/ holds the MilkDrop/projectM parity certification corpus,
    # the compiler/IR/codegen goldens and the pixel-diff suite. The
    # dual-backend boundary they cover is the repo's densest source of
    # regressions.
    #
    # `bun run check` now runs them too, via the `gate` profile — they used to
    # be CI-only, which meant a compiler change could pass the local gate and
    # only fail here, after push. That is exactly how 83d2f274 left the
    # projectM snapshot stale and main red for a day. This job stays as the
    # backstop for anyone who pushes without running the gate.
    #
    # This is deliberately not the e2e visual-regression test, which stays
    # local-only: that one renders through SwiftShader on a 2-core runner, and
    # its timing assertions produced a long run of budget-widening commits
    # without ever catching a rendering bug. The corpus is CPU-only and
    # deterministic — same input, same shader text, same pixels — so it fails
    # for real reasons. It takes about 10s.
    steps:
      # The runner must read the local composite action's action.yml from
      # disk before it can run it, so the repository has to be checked out
      # in the workflow itself — a local action can never perform the first
      # checkout (newer runner versions fail the job at action-resolution
      # time otherwise).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      # The loop-preset visual sweep in tests/corpus/ launches headless
      # Chromium, so the corpus is no longer browser-free.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run parity corpus
        run: bun run test:corpus

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Pure gate: deploys moved to Cloudflare Workers Builds (see
    # docs/DEPLOYMENT.md), which builds and deploys on push independently of
    # Actions. This job only proves the production bundle still builds.
    steps:
      # The runner must read the local composite action's action.yml from
      # disk before it can run it, so the repository has to be checked out
      # in the workflow itself — a local action can never perform the first
      # checkout (newer runner versions fail the job at action-resolution
      # time otherwise).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Build production bundle
        run: bun run build

      # The budget guard needs dist/, so it runs here rather than in the
      # quality gate (see the script's docblock). It was added with the lazy
      # EditorPanel work and then never wired to anything, which left the
      # startup payload unguarded against step-change regressions.
      - name: Check bundle-size budget
        run: bun run check:bundle-size

  integration:
    name: Browser end-to-end tests (${{ matrix.file }})
    runs-on: ubuntu-latest
    # Each e2e file gets its own runner. They used to share one job's 2 vCPUs
    # sequentially — a fresh `bun test` process per file (see run-tests.ts)
    # stopped in-process leaks from accumulating, but everything still
    # competed for the same runner's CPU/GPU budget, so whichever test
    # happened to run during a contention spike would flake with a timeout
    # that never reproduced locally. A fresh runner per file removes that
    # shared budget entirely.
    strategy:
      fail-fast: false
      matrix:
        file:
          - agent-integration.test.ts
          - chrome-visual-contract.test.ts
          - e2e-engine-mount.test.ts
    steps:
      # The runner must read the local composite action's action.yml from
      # disk before it can run it, so the repository has to be checked out
      # in the workflow itself — a local action can never perform the first
      # checkout (newer runner versions fail the job at action-resolution
      # time otherwise).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # engine-mount launches a headed browser for real canvas rendering, so
      # it needs a virtual display; xvfb ships with Playwright's --with-deps
      # and Chromium falls back to SwiftShader for WebGL under it.
      - name: Run browser end-to-end tests
        run: xvfb-run -a bun test --preload=./tests/setup.ts --max-concurrency=1 tests/e2e/${{ matrix.file }}

  visual-evidence:
    name: Visual evidence (manual)
    runs-on: ubuntu-latest
    # No job here should ever legitimately run long: ui:diff + two
    # lab:visual presets normally finish in a few minutes. Without this,
    # a hang (confirmed: lab:visual silently hung after starting its
    # second preset's dev server, no output, no crash) runs to GitHub's
    # default 6-hour job timeout and burns that much billed runner time
    # for nothing. Keep this well above normal runtime but far below "hours".
    timeout-minutes: 20
    # Manual-only, deliberately not part of ci-status or its `needs:` list.
    # Captures + reports; asserts nothing on pixel content. The old e2e
    # visual-regression test was removed from `integration` above because
    # SwiftShader timing assertions on a shared runner flaked without ever
    # catching a real rendering bug (see the `parity` job comment). This job
    # sidesteps that by uploading evidence for a human/agent to look at
    # instead of asserting pass/fail on it — run it on demand from a branch
    # or PR when you want proof a visual change landed, without CI blocking
    # on inherently noisy SwiftShader pixel/timing comparisons.
    if: github.event_name == 'workflow_dispatch'
    # Opts out of the workflow-level concurrency group (keyed on the shared
    # ref, cancel-in-progress: true) with a group unique to this run. This
    # job's own steps take longer than the gap between pushes on a busy
    # main, and being sat in the shared group meant every dispatch got
    # cancelled mid-capture by the next push before it could finish.
    concurrency:
      group: ci-visual-evidence-${{ github.run_id }}
      cancel-in-progress: false
    env:
      # `secrets` isn't a valid context inside `if:` expressions, so the
      # deploy step below checks these env vars instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # A local composite action can't perform the first checkout (see the
      # `check` job above for why) — this job skipped it and failed at
      # action-resolution time before this fix.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-stims
        with:
          checkout: 'false'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Capture UI harness screenshots + baseline diff
        run: bun run ui:diff
        continue-on-error: true

      - name: Capture bundled preset visuals (software rendering — no GPU on this runner)
        timeout-minutes: 10
        env:
          STIMS_SOFTWARE_RENDER: '1'
        run: |
          bun run lab:visual -- \
            --preset eos-glowsticks-v2-03-music \
            --preset rovastar-parallel-universe
        continue-on-error: true

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ github.sha }}
          path: |
            screenshots/ui-diff/
            scratch/preset-lab/
          if-no-files-found: warn
          retention-days: 14

      # Real deploy of a live URL (a Worker *version* preview, not production
      # traffic — see docs/DEPLOYMENT.md), for anyone/anything that wants to
      # look at the actual thing rather than a SwiftShader-rendered
      # screenshot. Requires Cloudflare deploy credentials as repo secrets;
      # skipped (not failed) when they aren't configured, so this stays safe
      # on forks and doesn't block the rest of the job.
      - name: Deploy live preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          bun run preview:deploy -- --json | tee preview-url.json
          echo "### Live preview" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- URL: " + (.url // "deploy failed — see job log")' preview-url.json >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [check, parity, build, integration, commit-messages]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          # commit-messages is pull_request-only, so it reports "skipped" on
          # push/merge_group runs. Skipped is a pass here; only an actual
          # failure should block.
          commit_outcome="${{ needs['commit-messages'].result }}"
          check_outcome="${{ needs.check.result }}"
          parity_outcome="${{ needs.parity.result }}"
          build_outcome="${{ needs.build.result }}"
          integration_outcome="${{ needs.integration.result }}"

          echo "Commit Messages: $commit_outcome"
          echo "Quality Gate: $check_outcome"
          echo "Parity Corpus: $parity_outcome"
          echo "Production Build: $build_outcome"
          echo "Integration Tests: $integration_outcome"

          if [ "$commit_outcome" != "failure" ] && \
             [ "$commit_outcome" != "cancelled" ] && \
             [ "$check_outcome" = "success" ] && \
             [ "$parity_outcome" = "success" ] && \
             [ "$build_outcome" = "success" ] && \
             [ "$integration_outcome" = "success" ]; then
            echo "All CI jobs passed successfully."
            exit 0
          else
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-hygiene:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git log --format='%s' "$base..HEAD" | while IFS= read -r subject; do
            echo "$subject" > /tmp/msg.txt
            bun run check:commit-msg /tmp/msg.txt || exit 1
          done

  shader-parity:
    name: Shader & compiler regression
    runs-on: ubuntu-latest
    # Surface MilkDrop compiler/shader regressions as a dedicated check.
    # The catalog compiler smoke runs in the quality gate unit suite too,
    # but this job is path-triggered so it reports independently on PRs
    # touching the rendering pipeline.
    if: >-
      github.event_name == 'pull_request' &&
      !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for pipeline changes
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base..HEAD" -- src/js/milkdrop/ src/shaders/ public/milkdrop-presets/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run catalog compiler smoke + shader analysis
        if: steps.changed.outputs.run == 'true'
        run: bun run test tests/unit/catalog-compiler-smoke.test.ts tests/unit/milkdrop-compiler-shader-analysis.test.ts tests/unit/milkdrop-compiler-compatibility.test.ts tests/unit/milkdrop-shader-sampler-aliases.test.ts tests/unit/milkdrop-shader-execution-classification.test.ts tests/unit/primitive-rasterization-fidelity.test.ts

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run check

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Runs alongside `check` rather than after it: a build failure and a test
    # failure are independent signals, and gating deploy on both jobs (see
    # deploy_preview/deploy_production `needs:`) gets the same safety without
    # paying for them serially in one job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Runs the full e2e profile (agent-integration + engine-mount). The
      # engine-mount suite launches a headed browser for real canvas rendering,
      # so it needs a virtual display; xvfb ships with Playwright's --with-deps
      # and Chromium falls back to SwiftShader for WebGL under it.
      - name: Run browser end-to-end tests
        run: xvfb-run -a bun run test:e2e

  deploy_preview:
    name: Deploy Pages preview
    runs-on: ubuntu-latest
    needs:
      - check
      - build
      - integration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_DEPLOYS_DISABLED != 'true'
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CF_PAGES_BRANCH: ${{ github.head_ref }}
        run: bun run pages:deploy:preview:reuse

      - name: Skip preview deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare Pages preview deploy skipped because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."

  deploy_production:
    name: Deploy Pages production
    runs-on: ubuntu-latest
    needs:
      - check
      - build
      - integration
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_PAGES_DEPLOYS_DISABLED != 'true'
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Deploy production to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: bun run pages:deploy:production:reuse

      - name: Skip production deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare Pages production deploy skipped because CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."
